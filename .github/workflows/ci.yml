#
# Continuous-integration test gate. Runs the Vitest suites across all workspaces.
#   - This is the HARD gate (D23): as of Sprint 4.1 a test failure fails the job, which (via the
#     `develop` branch-protection required-status-check) BLOCKS merge into develop. It supersedes the
#     soft-mode (`continue-on-error`) era that ran from Sprint 2.2 through Epic 3.
#   - Triggers on pull_request INTO develop (so it gates the merge) and on push to develop (so a direct
#     push is still verified). Deliberately separate from deploy-dev.yml: this workflow needs no
#     secrets and no `id-token`/deploy permissions, so nothing a PR can trigger carries deploy rights.

name: ci

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    # Distinct check name (not the generic "Test") so the develop branch-protection required-status
    # context can't be accidentally satisfied by some future workflow that also has a "Test" job.
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-node BEFORE pnpm/action-setup: pnpm 11.3.0 requires Node >=22.13, but the runner's
      # default Node is 20, so installing pnpm first fails ERR_PNPM_UNSUPPORTED_ENGINE.
      - uses: actions/setup-node@v4
        with:
          node-version: 22       # D18 runtime/CI parity
      - uses: pnpm/action-setup@v4
        with:
          standalone: true     # install @pnpm/exe (bundles its own Node). pnpm/action-setup is a JS
                               # action, so it runs under the runner's Node 20 -- too old to install
                               # pnpm 11.3.0 via the normal self-installer (ERR_PNPM_UNSUPPORTED_ENGINE).
      - run: pnpm install --frozen-lockfile
      - run: pnpm test           # Vitest across workspaces (D23/D34) -- hard gate, no continue-on-error

  secret-scan:
    # Layer 2 of the D48 secret-scanning posture. GitHub-native secret scanning + push protection are
    # layer 1 (free on this public repo; re-enabled after the 2026-11 transfer to the klundt-org org,
    # which reset them). This job runs gitleaks over the FULL git history on every PR / push to develop
    # and BLOCKS merge via the develop branch-protection required check. The pinned gitleaks BINARY is
    # used deliberately -- the gitleaks GitHub Action requires a paid license for organization accounts;
    # the MIT CLI has no such gate. Config + allowlist: .gitleaks.toml (extends the built-in ruleset).
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history: gitleaks scans every commit, not just HEAD
      - name: gitleaks (scan full history)
        env:
          GITLEAKS_VERSION: '8.30.1'   # pinned (version discipline, docs/VERSIONS.md)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact -v --no-banner --exit-code 1 .
