#
# Sprint 6.0 — builds the transcoder container image, pushes it to GHCR, and updates the dev
# Container App revision. The image-side counterpart to deploy-dev.yml (which ships frontend+API).
#
#   - Registry: PUBLIC GHCR (ghcr.io/klundt-org/slaylist-transcoder) — D49. The image holds only
#     public (AGPL) code + public tooling, no secrets or family data, so a public image leaks
#     nothing AND needs no pull credential on the Container App.
#   - Push auth: the automatic GITHUB_TOKEN (permissions.packages: write) — no stored PAT/secret.
#   - Deploy auth: OIDC federation via the `dev` GitHub environment (D30/D37), same identity that
#     deploys the app. `az containerapp update` runs under that session (Contributor on the dev RG).
#   - Image/Bicep split (D39 impl. note): Bicep owns the Container App SHELL; the running image
#     DIGEST is a CD-managed artifact set here (like Epic 2's SWA site content), not Bicep-tracked.
#   - No D22 gate here: the Container App has no ingress (queue-driven), so there is no public edge.

name: deploy-transcoder-dev

on:
  push:
    branches: [develop]
    paths:
      - 'transcoder/**'
      - '.github/workflows/deploy-transcoder-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR with the automatic GITHUB_TOKEN (no stored secret)
  id-token: write   # OIDC for azure/login

env:
  IMAGE: ghcr.io/klundt-org/slaylist-transcoder
  AZURE_RG: rg-music-slaylist-dev-use2
  CA_NAME: ca-music-slaylist-dev-use2

jobs:
  build-push-deploy:
    name: Build + push image + update dev Container App
    runs-on: ubuntu-latest
    environment: dev    # OIDC subject -> environment:dev; exposes dev env-scoped secrets only
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (automatic GITHUB_TOKEN — no stored secret)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image (moving :dev tag + immutable :sha-<gitsha>)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./transcoder
          file: ./transcoder/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Azure login (OIDC — no stored secret, D30)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update dev Container App to the pushed image (by immutable digest)
        # Deploy by DIGEST, not the moving :dev tag, so the revision is pinned to exactly the
        # bytes this run built (reproducible, rollback-able) and a new revision is always created.
        run: |
          az containerapp update \
            -n "$CA_NAME" -g "$AZURE_RG" \
            --image "${IMAGE}@${{ steps.build.outputs.digest }}"
